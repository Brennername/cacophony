services:
  cacophony-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cacophony-engine
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-24072}:${PORT_API:-24161}"
      - "${PORT_API:-24161}:${PORT_API:-24161}"
      - "${PORT_MCP:-21264}:${PORT_MCP:-21264}"
    environment:
      - NODE_ENV=production
      - DB_DRIVER=${DB_DRIVER:-pglite}
      - DB_PATH=/app/data/cacophony_pglite
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-4096}
      - DEFAULT_IMPLEMENTER_MODEL=${DEFAULT_IMPLEMENTER_MODEL:-qwen2.5-coder:7b-instruct-q4_K_M}
      - DEFAULT_REVIEWER_MODEL=${DEFAULT_REVIEWER_MODEL:-qwen2.5-coder:7b-instruct-q4_K_M}
      - FRONTIER_REVIEWER_MODEL=${FRONTIER_REVIEWER_MODEL:-qwen2.5-coder:7b-instruct-q4_K_M}
      - GITEA_BASE_URL=${GITEA_BASE_URL:-http://cacophony-gitea:3000}
      - GITEA_PUBLIC_URL=${GITEA_PUBLIC_URL:-http://localhost:19634}
      - GITEA_API_TOKEN=${GITEA_API_TOKEN:-}
      - GIT_REPO_OWNER=${GIT_REPO_OWNER:-NeXeN}
      - GIT_REPO_NAME=${GIT_REPO_NAME:-cacophony}
      - GIT_REMOTE=${GIT_REMOTE:-gitea}
      - GITEA_OAUTH_CLIENT_ID=${GITEA_OAUTH_CLIENT_ID:-cacophony-dashboard}
      - GITEA_OAUTH_CLIENT_SECRET=${GITEA_OAUTH_CLIENT_SECRET:-}
      - GITEA_OAUTH_REDIRECT_URI=${GITEA_OAUTH_REDIRECT_URI:-http://localhost:24072/auth/callback}
      - SYSFS_DRM_PATH=/host/sys/class/drm
      - SYSFS_HWMON_PATH=/host/sys/class/hwmon
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./conf:/app/conf:ro
      - ./data:/app/data:rw
      - ./workspaces:/app/workspaces:rw
      - ./.git:/app/.git:rw
      - ./.env:/app/.env:ro
      - /sys:/host/sys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cacophony-gitea
    networks:
      - cacophony-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:24161/api/status"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  cacophony-gitea:
    image: gitea/gitea:1.22-rootless
    container_name: cacophony-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/var/lib/gitea/data/gitea.db
      - GITEA__server__ROOT_URL=${GITEA_PUBLIC_URL:-http://localhost:19634/}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__DISABLE_SSH=false
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__service__REGISTER_EMAIL_CONFIRM=${GITEA_REQUIRE_EMAIL_CONFIRM:-false}
      - GITEA__service__ENABLE_NOTIFY_MAIL=${GITEA_ENABLE_MAIL_CATCHER:-false}
      - GITEA__mailer__ENABLED=${GITEA_ENABLE_MAIL_CATCHER:-false}
      - GITEA__mailer__PROTOCOL=smtp
      - GITEA__mailer__SMTP_ADDR=cacophony-mailpit
      - GITEA__mailer__SMTP_PORT=1025
      - GITEA__mailer__FROM=cacophony-gitea@local.internal
      - GITEA__oauth2__ENABLE=true
    ports:
      - "${PORT_GITEA_HTTP:-19634}:3000"
      - "${PORT_GITEA_SSH:-17883}:2222"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    networks:
      - cacophony-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  cacophony-mailpit:
    image: axllent/mailpit:latest
    container_name: cacophony-mailpit
    restart: unless-stopped
    ports:
      - "${PORT_MAILPIT_HTTP:-15417}:8025"
      - "${PORT_MAILPIT_SMTP:-18860}:1025"
    networks:
      - cacophony-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8025/api/v1/messages?limit=1"]
      interval: 30s
      timeout: 5s
      retries: 3

  cacophony-redis:
    image: docker.io/library/redis:alpine
    container_name: cacophony-redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - cacophony-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3

  cacophony-authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.8.3}
    container_name: cacophony-authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: cacophony-redis
      AUTHENTIK_POSTGRESQL__HOST: ${AUTHENTIK_POSTGRESQL__HOST:-cacophony-engine}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-cacophony}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS:-cacophony}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs
      - ./conf/authentik/blueprints:/blueprints:ro
    ports:
      - "${PORT_AUTHENTIK_HTTP:-9000}:9000"
      - "${PORT_AUTHENTIK_HTTPS:-9443}:9443"
    depends_on:
      - cacophony-redis
    networks:
      - cacophony-net

  cacophony-authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.8.3}
    container_name: cacophony-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: cacophony-redis
      AUTHENTIK_POSTGRESQL__HOST: ${AUTHENTIK_POSTGRESQL__HOST:-cacophony-engine}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-cacophony}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS:-cacophony}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs
      - ./conf/authentik/blueprints:/blueprints:ro
    depends_on:
      - cacophony-redis
    networks:
      - cacophony-net

volumes:
  gitea-data:
    driver: local
  gitea-config:
    driver: local
  redis-data:
    driver: local
  authentik-media:
    driver: local
  authentik-templates:
    driver: local
  authentik-certs:
    driver: local

networks:
  cacophony-net:
    driver: bridge
