@if (isSoloSession()) {
  <button
    class="solo-plus-btn"
    (click)="createNewTab()"
    title="Create new session tab"
    aria-label="Create new session tab"
  >
    +
  </button>
} @else {
  <nav class="tabs-container" aria-label="Active Sessions">
    <div class="tabs-scroll-area">
      @for (tab of tabs(); track tab.id) {
        <div
          class="tab-item"
          [class.active]="activeTabId() === tab.id"
          (click)="selectTab(tab.id)"
          role="button"
          tabindex="0"
          (keydown.enter)="selectTab(tab.id)"
        >
          <div class="tab-content">
            <span class="tab-title">{{ tab.title }}</span>
            <span class="tab-branch">[{{ tab.branch }}]</span>
            @if (tab.activeModel) {
              <span class="tab-model font-mono">{{ tab.activeModel }}</span>
            }
            @if (tab.isModified) {
              <span class="tab-dot" aria-label="Modified">•</span>
            }
          </div>
          @if (tabs().length > 1) {
            <button class="tab-close-btn" (click)="closeTab($event, tab.id)" aria-label="Close tab">
              ×
            </button>
          }
        </div>
      }
      <button class="new-tab-btn" (click)="createNewTab()" aria-label="New Session Tab" title="New Session Tab">
        +
      </button>
    </div>
  </nav>
}
