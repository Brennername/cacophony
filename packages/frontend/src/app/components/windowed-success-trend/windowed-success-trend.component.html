<div class="windowed-success-trend">
  <div class="controls">
    <label for="window-size">Window Size:</label>
    <select id="window-size" [(ngModel)]="selectedWindowSize" (change)="updateWindowSize()">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="1000">1000</option>
      <option value="total">Total</option>
    </select>

    <label for="qualification-filter">Qualification Filter:</label>
    <select id="qualification-filter" [(ngModel)]="selectedFilter" (change)="updateFilter()">
      <option value="role">By Role</option>
      <option value="model">By Model</option>
      <option value="branch/commit">By Branch/Commit</option>
    </select>
  </div>

  <trend-chart [data]="filteredData" [options]="chartOptions"></trend-chart>
</div>
