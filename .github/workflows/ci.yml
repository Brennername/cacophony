name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Compile monorepo packages
        run: npm run build

      - name: Lint codebase
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Enforce test coverage threshold gate
        id: coverage-report
        run: npm run --workspace=@cacophony/engine test:coverage

      - name: Build Docker container image for security scan
        run: docker build -t cacophony:ci .

      - name: Scan container image with Trivy (CVE scanner)
        id: container-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cacophony:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
